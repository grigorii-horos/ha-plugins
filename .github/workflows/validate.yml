name: validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cards/package-lock.json
      - run: npm ci
        working-directory: cards
      - run: npm test
        working-directory: cards
      - run: npm run build
        working-directory: cards
      # The built bundle lives in the repository: HACS installs the plugin straight
      # from it, so drifting from the sources means a broken install for users.
      - name: dist matches the sources
        run: git diff --exit-code -- dist

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: plugin
